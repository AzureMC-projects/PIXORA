[workspace]
resolver = "2"
members = ["crates/pixora-core", "apps/pixora-photo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["JacobProjects"]
repository = "https://github.com/AzureMC-projects/PIXORA"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
