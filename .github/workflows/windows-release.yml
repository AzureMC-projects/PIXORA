name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build PIXORA Photo
        run: cargo build --release -p pixora-photo
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PIXORA.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXORA-Windows-Installer
          path: dist/PIXORA-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to v0.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/PIXORA-Setup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
