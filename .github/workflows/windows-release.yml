name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build PIXORA Photo and PDF
        run: |
          cargo build --release -p pixora-photo -p pixora-pdf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Download PDFium runtime
        run: |
          Invoke-WebRequest -Uri "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz" -OutFile pdfium.tgz
          tar -xzf pdfium.tgz
          $dll = Get-ChildItem -Path . -Filter pdfium.dll -Recurse | Select-Object -First 1
          if (-not $dll) { throw "pdfium.dll was not found in the downloaded archive." }
          New-Item -ItemType Directory -Force -Path "target\release" | Out-Null
          Copy-Item $dll.FullName "target\release\pdfium.dll" -Force
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\PIXORA.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PIXORA-Windows-Installer
          path: dist/PIXORA-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to v0.1.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/PIXORA-Setup.exe
          fail_on_unmatched_files: true
          overwrite_files: true
